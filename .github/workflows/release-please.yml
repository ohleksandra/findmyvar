name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Outputs go through env vars, not ${{ }} inside the script: the `pr` output is JSON with
      # the changelog in it, and pasting that into bash breaks on any "(" (and runs PR text as code).
      - name: Log release result
        env:
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          MAJOR: ${{ steps.release.outputs.major }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          echo "Release created: $RELEASE_CREATED"
          echo "Tag: $TAG_NAME"
          echo "Major version: $MAJOR"
          echo "Release PR: $(jq -r 'if . then "#\(.number) \(.title)" else "none" end' <<< "${RELEASE_PR:-null}")"

  trigger-assets:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Trigger release-assets workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run release-assets.yml \
            -f tag="${{ needs.release-please.outputs.tag_name }}"
